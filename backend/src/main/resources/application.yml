server:
  port: 8080

app:
  security:
    cookie:
      domain: localhost
      secure: false
      http-only: true
      same-site: Lax
      access-token-max-age: 30d
      refresh-token-max-age: 30d

spring:
  application:
    name: e-commerce
  datasource:
    url: "jdbc:mysql://localhost:3306/db_ecommerce"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 30MB # Tối đa 1 file là 10MB
      max-request-size: 10MB  # Tổng cả request tối đa 50MB

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.khahnm04.ecommerce.modules
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    lazy-loading-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE

api:
  prefix: /api/v1 # http://localhost:8080/api/v1

# Cloudinary Configuration
cloudinary:
  cloud-name: "${CLOUD_NAME}"
  api-key: "${API_KEY}"
  api-secret: "${API_SECRET}"

jwt:
  signerKey: "${SIGNER_KEY}"
  access-token-expiration: 360 # in seconds
  refresh-token-expiration: 3600 # in seconds
