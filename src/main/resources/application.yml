server:
  port: 8080

api:
  prefix: /api/v1 # http://localhost:8080/api/v1

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: e-commerce
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_entry_ecommerce}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

openapi:
  service:
    server-url: http://localhost:8080
    server-description: Local
    title: E-Commerce API Documentation
    description: API documentation for E-Commerce platform
    version: 1.0.0
    contact:
      name: Nguyen Minh Khanh
      email: support@khahnm04.com

jwt:
  secret-key: ${SECRET_KEY}
  access-token-expiration: 300
  refresh-token-expiration: 86400
  remember-me-expiration: 604800

cloudinary:
  cloud-name: "${CLOUD_NAME}"
  api-key: "${API_KEY}"
  api-secret: "${API_SECRET}"
