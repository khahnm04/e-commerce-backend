server:
  port: 8080

api:
  prefix: /api/v1

spring:
  application:
    name: e-commerce
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "jdbc:mysql://localhost:3306/db_entry_ecommerce"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

openapi:
  service:
    server-url: http://localhost:8080
    server-description: Local
    title: E-Commerce API Documentation
    description: API documentation for E-Commerce platform
    version: 1.0.0
    contact:
      name: Nguyen Minh Khanh
      email: support@khahnm04.com

jwt:
  secret-key: ${SECRET_KEY}
  access-token-expiration: 300
  refresh-token-expiration: 86400

cloudinary:
  cloud-name: ${CLOUD_NAME}
  api-key: ${API_KEY}
  api-secret: ${API_SECRET}
