server:
  port: ${PORT:8080}

app:
  security:
    cookie:
      domain: ${COOKIE_DOMAIN:localhost}
      secure: ${COOKIE_SECURE:false}
      http-only: true
      same-site: Lax
      access-token-max-age: 10000s
      refresh-token-max-age: 86400s

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: e-commerce
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_ecommerce}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 30MB # Tối đa 1 file là 10MB
      max-request-size: 10MB  # Tổng cả request tối đa 50MB

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.khahnm04.ecommerce.modules
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    lazy-loading-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE

api:
  prefix: /api/v1 # http://localhost:8080/api/v1

# Cloudinary Configuration
cloudinary:
  cloud-name: "${CLOUD_NAME}"
  api-key: "${API_KEY}"
  api-secret: "${API_SECRET}"

jwt:
  signerKey: "${SIGNER_KEY}"
  access-token-expiration: 10000
  refresh-token-expiration: 86400 # in seconds (24 hours)
