server:
  port: 8080

api:
  prefix: /api/v1

spring:
  application:
    name: e-commerce-backend
  config:
    import: "optional:file:.env[.properties]"
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/db_ecommerce?reWriteBatchedInserts=true"
    driver-class-name: org.postgresql.Driver
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    datatype:
      enum:
        write-enums-to-lowercase: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

jwt:
  secret-key: ${SECRET_KEY}
  access-token-expiration: 3600
  refresh-token-expiration: 86400

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: https://${ACCOUNT_ID}.r2.cloudflarestorage.com
    bucket: ${BUCKET_NAME}
